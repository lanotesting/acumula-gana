<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="src/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="src/css/bootstrap.css">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Mrs. Rush | ¡Acummula y Gana!</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="column col-12 col-md-6 col-lg-3 d-block vh-100 w-100 d-flex align-items-center justify-content-center">
                <div class="form-box">
                    <form id="register-client">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" name="name" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo eléctronico:</label>
                            <input type="email" class="form-control" name="email" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label" required>Teléfono:</label>
                            <input type="text" class="form-control" name="phone" id="phone">
                        </div>
                        <button type="submit" class="btn btn-primary d-block mx-auto "><strong>¡Listo!</strong></button>
                    </form>
                </div>
            </div>
        </div> 
    </div>





    <script src="src/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/app.js"></script>

</body>
</html>
